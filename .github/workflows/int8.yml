name: Modèle int8 (export NeMo, conversion, comparaison, brouillon)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Étiquette de la version (brouillon) à créer"
        required: true
        default: "fastconformer-quran-v1.1-int8-r1"
      mode:
        description: "offline = décodage par segments ; streaming = en flux (cache-aware)"
        type: choice
        options: [offline, streaming]
        default: offline
      publish:
        description: "Créer la version en brouillon"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VAD_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
  NEMO_REPO: dev-ahmedhany/stt_ar_fastconformer_hybrid_large_streaming_pcd_v1.1-mirror
  NEMO_FILE: streaming_v11_epoch7.nemo

jobs:
  int8:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils (NeMo sur CPU, mêmes ONNX Runtime et sherpa-onnx que l'application)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install -q "torch==2.8.0" "torchaudio==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -q "nemo_toolkit[asr]" onnx onnxruntime==1.24.4 sherpa-onnx==1.12.35 numpy
          pip freeze | grep -iE "^(torch|nemo|onnx|sherpa|numpy)" | tee versions.txt

      - name: Point de contrôle NeMo d'origine
        run: |
          SHA=$(curl -fsSL "https://huggingface.co/api/models/$NEMO_REPO" | python -c "import json,sys;print(json.load(sys.stdin)['sha'])")
          echo "NEMO_SHA=$SHA" >> "$GITHUB_ENV"
          curl -fsSL --retry 5 -o model.nemo "https://huggingface.co/$NEMO_REPO/resolve/$SHA/$NEMO_FILE"
          echo "$NEMO_REPO@$SHA/$NEMO_FILE" | tee source.txt
          sha256sum model.nemo | tee -a source.txt

      - name: Export ONNX (script officiel sherpa-onnx)
        run: python scripts/export_nemo.py model.nemo fp32 ${{ inputs.mode == 'offline' && '--offline' || '' }}

      - name: Conversion int8
        run: python scripts/quantize.py fp32 int8

      - name: Versets de test
        run: python scripts/fetch_test_audio.py audio

      - name: Comparaison fp32 / int8
        run: |
          python scripts/evaluate.py fp32 int8 audio report.md ${{ inputs.mode == 'offline' && '--offline' || '' }}
          { echo; echo "Source : \`$(head -1 source.txt)\`"; } >> report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Détecteur de pauses (Silero VAD) et récitation continue
        if: ${{ inputs.mode == 'offline' }}
        run: |
          curl -fsSL --retry 5 -o int8/silero_vad.onnx "$VAD_URL"
          python scripts/evaluate_vad.py int8 int8/silero_vad.onnx audio report-vad.md
          cat report-vad.md >> report.md
          { echo; cat report-vad.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Empreintes du modèle int8
        run: |
          cd int8
          FILES="encoder.int8.onnx decoder.int8.onnx joiner.int8.onnx tokens.txt $(ls silero_vad.onnx 2>/dev/null)"
          echo "FILES=$FILES" >> "$GITHUB_ENV"
          sha256sum $FILES | tee ../int8.sha256
          stat -c '%n %s' $FILES | tee ../int8.sizes
          { echo; echo '## Fichiers int8'; echo; echo '```'; cat ../int8.sha256; cat ../int8.sizes; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: rapport-int8
          path: |
            report.md
            int8.sha256
            int8.sizes
            versions.txt
            source.txt

      - name: Publication en brouillon (non visible tant qu'elle n'est pas validée)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Modèle FastConformer-Quran quantifié en int8 pour Karaböl."; echo;
            echo "Source : https://huggingface.co/$NEMO_REPO (commit $NEMO_SHA, fichier $NEMO_FILE), licence CC-BY-4.0.";
            echo "Détecteur de pauses : silero_vad.onnx (Silero, licence MIT), copie de $VAD_URL.";
            echo "Modifications : export ONNX en 3 fichiers (mode ${{ inputs.mode }}) avec le script officiel sherpa-onnx, puis quantification dynamique int8 (QUInt8) avec ONNX Runtime."; echo;
            cat report.md; echo; echo '```'; cat int8.sha256; echo '```'; } > notes.md
          gh release delete "${{ inputs.release_tag }}" --yes --cleanup-tag || true
          gh release create "${{ inputs.release_tag }}" --draft --title "${{ inputs.release_tag }}" --notes-file notes.md \
            $(for f in $FILES; do echo "int8/$f"; done)
