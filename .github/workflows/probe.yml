name: Diagnostic de l'encodeur (fenêtre de flux)

on: workflow_dispatch

env:
  HF_REPO: dev-ahmedhany/stt_ar_fastconformer_hybrid_large_streaming_pcd_v1.1-sherpa
  HF_REVISION: 2efcdd746b5470480de0787ba781e5622c080fc1

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q onnxruntime==1.24.4 numpy==2.5.5
      - name: Fichiers et fiche du modèle
        run: |
          curl -fsSL "https://huggingface.co/api/models/$HF_REPO/tree/$HF_REVISION?recursive=true" | python -c "import json,sys;[print(f['path'],f.get('size')) for f in json.load(sys.stdin)]" || true
          curl -fsSL "https://huggingface.co/$HF_REPO/resolve/$HF_REVISION/README.md" || true
          echo; echo "=== miroir"; curl -fsSL "https://huggingface.co/dev-ahmedhany/stt_ar_fastconformer_hybrid_large_streaming_pcd_v1.1-mirror/resolve/main/README.md" || true
          curl -fsSL "https://huggingface.co/api/models/dev-ahmedhany/stt_ar_fastconformer_hybrid_large_streaming_pcd_v1.1-mirror/tree/main?recursive=true" | python -c "import json,sys;[print(f['path'],f.get('size')) for f in json.load(sys.stdin)]" || true
      - name: Essais de fenêtre
        run: |
          curl -fsSL -o encoder.onnx "https://huggingface.co/$HF_REPO/resolve/$HF_REVISION/encoder.onnx"
          python scripts/probe_encoder.py encoder.onnx
